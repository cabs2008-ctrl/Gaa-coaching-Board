<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAA Tactics Board</title>

<style>
body { margin:0; display:flex; font-family:sans-serif; }

/* sidebar */
#sidebar {
  width:140px;
  background:#111;
  padding:10px;
  display:flex;
  flex-wrap:wrap;
}

.player {
  width:36px; height:36px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  margin:4px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  position:relative;
}

.green { background:#4caf50; color:#000; }
.blue { background:#2196f3; color:#fff; }

/* pitch */
#pitchWrap {
  flex:1;
  position:relative;
  background:#2e7d32;
}

canvas {
  position:absolute;
  top:0;
  left:0;
}

/* toolbar */
#toolbar {
  position:absolute;
  top:10px;
  right:10px;
  z-index:10;
}
button {
  margin-left:5px;
  padding:6px 10px;
}
</style>

</head>

<body>

<div id="sidebar"></div>

<div id="pitchWrap">

<div id="toolbar">
  <button onclick="drawMode = !drawMode">Draw</button>
  <button onclick="undo()">Undo</button>
  <button onclick="clearCanvas()">Clear</button>
</div>

<!-- PITCH -->

<svg viewBox="0 0 1000 500" style="position:absolute; width:100%; height:100%;">

  <!-- OUTER -->

  <rect x="10" y="10" width="980" height="480" stroke="white" fill="none"/>

  <!-- HALF -->

  <line x1="500" y1="10" x2="500" y2="490" stroke="white"/>

  <!-- 13 / 20 / 45 -->

  <line x1="150" y1="10" x2="150" y2="490" stroke="white"/>
  <line x1="220" y1="10" x2="220" y2="490" stroke="white"/>
  <line x1="320" y1="10" x2="320" y2="490" stroke="white"/>

  <line x1="850" y1="10" x2="850" y2="490" stroke="white"/>
  <line x1="780" y1="10" x2="780" y2="490" stroke="white"/>
  <line x1="680" y1="10" x2="680" y2="490" stroke="white"/>

  <!-- GOALS -->

  <rect x="10" y="200" width="40" height="100" stroke="white" fill="none"/>
  <rect x="10" y="170" width="90" height="160" stroke="white" fill="none"/>

  <rect x="950" y="200" width="40" height="100" stroke="white" fill="none"/>
  <rect x="900" y="170" width="90" height="160" stroke="white" fill="none"/>

  <!-- SMALL D -->

  <path d="M 100 170 Q 200 250 100 330" stroke="white" fill="none"/>
  <path d="M 900 170 Q 800 250 900 330" stroke="white" fill="none"/>

  <!-- 40m ARC (touching 20m line) -->

  <path d="M 220 120 Q 360 250 220 380" stroke="white" fill="none"/>
  <path d="M 780 120 Q 640 250 780 380" stroke="white" fill="none"/>

</svg>

<canvas id="canvas"></canvas>

</div>

<script>
/* ---------- CANVAS ---------- */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const pitch = document.getElementById("pitchWrap");

function resize(){
  canvas.width = pitch.clientWidth;
  canvas.height = pitch.clientHeight;
}
resize();
window.addEventListener("resize", resize);

/* ---------- DRAW ---------- */
let drawMode = false;
let drawing = false;

let strokes = [];
let currentStroke = [];

canvas.addEventListener("mousedown", e=>{
  if(!drawMode) return;

  drawing = true;
  currentStroke = [];

  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  ctx.beginPath();
  ctx.moveTo(x, y);

  currentStroke.push({x,y});
});

canvas.addEventListener("mousemove", e=>{
  if(!drawing) return;

  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  ctx.lineTo(x, y);
  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;
  ctx.stroke();

  currentStroke.push({x,y});
});

canvas.addEventListener("mouseup", ()=>{
  if(drawing){
    strokes.push(currentStroke);
  }
  drawing = false;
});

/* ---------- UNDO ---------- */
function undo(){
  strokes.pop();
  redraw();
}

function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  strokes.forEach(stroke=>{
    ctx.beginPath();
    stroke.forEach((p,i)=>{
      if(i===0) ctx.moveTo(p.x,p.y);
      else ctx.lineTo(p.x,p.y);
    });
    ctx.strokeStyle = "white";
    ctx.lineWidth = 3;
    ctx.stroke();
  });
}

/* ---------- CLEAR ---------- */
function clearCanvas(){
  strokes = [];
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

/* ---------- PLAYERS ---------- */
const sidebar = document.getElementById("sidebar");

function makePlayer(color, num){
  const p = document.createElement("div");
  p.className = "player " + color;
  p.innerText = num;

  let dragging = false;

  p.addEventListener("mousedown", e=>{
    e.stopPropagation();
    dragging = true;
    document.body.appendChild(p);
    move(e);
  });

  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", ()=> dragging=false);

  function move(e){
    if(!dragging) return;
    p.style.position = "absolute";
    p.style.left = (e.pageX - 18) + "px";
    p.style.top = (e.pageY - 18) + "px";
  }

  sidebar.appendChild(p);
}

for(let i=1;i<=15;i++){
  makePlayer("green", i);
  makePlayer("blue", i);
}
</script>

</body>
</html>
