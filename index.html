<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAA Tactics Board</title>

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  background: #111;
  font-family: sans-serif;
}

/* PLAYER SIDEBAR */
.sidebar {
  width: 90px;
  background: #0d0d0d;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 10px;
  overflow-y: auto;
}

.player {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  margin: 6px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  cursor: grab;
}

.green { background: #2ecc71; color: black; }
.blue { background: #3498db; color: white; }

/* PITCH */
.pitch-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

canvas {
  border: 2px solid white;
  background: linear-gradient(#2e7d32, #1b5e20);
}
</style>
</head>

<body>

<div class="sidebar" id="players"></div>

<div class="pitch-container">
  <canvas id="pitch"></canvas>
</div>

<script>
const canvas = document.getElementById("pitch");
const ctx = canvas.getContext("2d");

canvas.width = 1000;
canvas.height = 500;

/* ---------------- PITCH ---------------- */

function drawPitch() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const w = canvas.width;
  const h = canvas.height;

  ctx.strokeStyle = "white";
  ctx.lineWidth = 2;

  // Outer lines
  ctx.strokeRect(0, 0, w, h);

  // GAA lines
  const lines = [0.13, 0.20, 0.45, 0.55, 0.80, 0.87];

  lines.forEach(x => {
    ctx.beginPath();
    ctx.moveTo(w * x, 0);
    ctx.lineTo(w * x, h);
    ctx.stroke();
  });

  drawGoals();
}

/* ---------------- GOALS ---------------- */

function drawGoals() {
  const h = canvas.height;
  const mid = h / 2;

  // LEFT
  drawGoal(0, mid, 1);

  // RIGHT
  drawGoal(canvas.width, mid, -1);
}

function drawGoal(goalX, midY, dir) {
  const big = 90;
  const small = 45;

  // Big rectangle
  ctx.strokeRect(goalX, midY - 100, dir * big, 200);

  // Small rectangle
  ctx.strokeRect(goalX, midY - 50, dir * small, 100);

  // Small D
  ctx.beginPath();
  ctx.arc(goalX + dir * big, midY, 35,
    dir === 1 ? Math.PI/2 : -Math.PI/2,
    dir === 1 ? 3*Math.PI/2 : Math.PI/2
  );
  ctx.stroke();

  // 40m arc (key fix — centred correctly)
  ctx.beginPath();
  ctx.arc(goalX, midY, 140,
    dir === 1 ? Math.PI/2 : -Math.PI/2,
    dir === 1 ? 3*Math.PI/2 : Math.PI/2
  );
  ctx.stroke();
}

/* ---------------- PLAYERS ---------------- */

const sidebar = document.getElementById("players");

for (let i = 1; i <= 15; i++) {
  const p1 = createPlayer(i, "green");
  const p2 = createPlayer(i, "blue");
  sidebar.appendChild(p1);
  sidebar.appendChild(p2);
}

function createPlayer(num, color) {
  const el = document.createElement("div");
  el.className = "player " + color;
  el.innerText = num;

  el.onmousedown = e => startDrag(e, el);

  return el;
}

/* ---------------- DRAG SYSTEM ---------------- */

let dragging = null;

function startDrag(e, el) {
  dragging = el;
  el.style.position = "absolute";
  moveAt(e);

  document.onmousemove = moveAt;
  document.onmouseup = () => {
    dragging = null;
    document.onmousemove = null;
  };
}

function moveAt(e) {
  if (!dragging) return;

  dragging.style.left = e.pageX - 20 + "px";
  dragging.style.top = e.pageY - 20 + "px";
}

/* ---------------- INIT ---------------- */

drawPitch();
</script>

</body>
</html>
