<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>GAA Tactics Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin:0; background:#2e7d32; }
  #pitch {
    width:100vw;
    height:100vh;
    position:relative;
  }
  svg {
    position:absolute;
    width:100%;
    height:100%;
  }
  .player {
    position:absolute;
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    cursor:grab;
    user-select:none;
  }
  .green { background:lime; color:black; }
  .black { background:black; color:white; }
</style>
</head>

<body>

<div id="pitch">

<!-- GAA Pitch -->

<svg>
  <rect x="20" y="20" width="calc(100% - 40px)" height="calc(100% - 40px)" stroke="white" fill="none"/>
  <line x1="50%" y1="20" x2="50%" y2="calc(100% - 20px)" stroke="white"/>

  <!-- 45m lines -->

  <line x1="20" y1="25%" x2="calc(100% - 20px)" y2="25%" stroke="white"/>
  <line x1="20" y1="75%" x2="calc(100% - 20px)" y2="75%" stroke="white"/>

  <!-- 21m lines -->

  <line x1="20" y1="35%" x2="calc(100% - 20px)" y2="35%" stroke="white"/>
  <line x1="20" y1="65%" x2="calc(100% - 20px)" y2="65%" stroke="white"/>

  <!-- Centre circle -->

  <circle cx="50%" cy="50%" r="60" stroke="white" fill="none"/>

  <!-- Goals -->

  <rect x="45%" y="20" width="10%" height="40" stroke="white" fill="none"/>
  <rect x="45%" y="calc(100% - 60px)" width="10%" height="40" stroke="white" fill="none"/>
</svg>

</div>

<script>
const pitch = document.getElementById("pitch");

function createPlayer(x,y,color,num){
  const p = document.createElement("div");
  p.className = "player " + color;
  p.innerText = num;
  p.style.left = x + "px";
  p.style.top = y + "px";

  let offsetX, offsetY, dragging = false;

  p.addEventListener("mousedown", (e)=>{
    dragging = true;
    offsetX = e.offsetX;
    offsetY = e.offsetY;
  });

  document.addEventListener("mouseup", ()=>{
    dragging = false;
  });

  document.addEventListener("mousemove", (e)=>{
    if(dragging){
      p.style.left = (e.clientX - offsetX) + "px";
      p.style.top = (e.clientY - offsetY) + "px";
    }
  });

  pitch.appendChild(p);
}

// Teams
for(let i=0;i<15;i++){
  createPlayer(100 + (i%5)*100, 100 + Math.floor(i/5)*100, "green", i+1);
  createPlayer(100 + (i%5)*100, 400 + Math.floor(i/5)*100, "black", i+1);
}
</script>

</body>
</html>
