<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAA Tactics Board</title>

<style>
body { margin:0; display:flex; height:100vh; background:#111; }

.sidebar {
  width:80px;
  background:#0d0d0d;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:10px;
}

.player {
  width:40px; height:40px;
  border-radius:50%;
  margin:6px 0;
  display:flex; align-items:center; justify-content:center;
  font-weight:bold; cursor:grab;
}

.green{background:#2ecc71;}
.blue{background:#3498db;color:white;}

.pitch-container{flex:1; position:relative;}

canvas{
  width:100%; height:100%;
  display:block;
  background:linear-gradient(#2e7d32,#1b5e20);
}

.toolbar{
  position:absolute;
  top:10px; right:10px;
}
</style>
</head>

<body>

<div class="sidebar" id="players"></div>

<div class="pitch-container">
<canvas id="pitch"></canvas>

<div class="toolbar">
<button onclick="mode='move'">Move</button>
<button onclick="mode='draw'">Draw</button>
<button onclick="undo()">Undo</button>
<button onclick="clearLines()">Clear</button>
</div>
</div>

<script>
const canvas=document.getElementById("pitch");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=canvas.clientWidth;
  canvas.height=canvas.clientHeight;
  draw();
}
window.addEventListener("resize",resize);

let mode="move";

/* ---------- DRAW PITCH ---------- */

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const w=canvas.width;
  const h=canvas.height;
  const mid=h/2;

  ctx.strokeStyle="white";
  ctx.lineWidth=2;

  // Outer
  ctx.strokeRect(0,0,w,h);

  const scale=w/160;

  const d13=13*scale;
  const d30=30*scale;

  // Midfield
  line(w/2);

  drawGoalSide(0,1,scale,mid,d13,d30);
  drawGoalSide(w,-1,scale,mid,d13,d30);

  drawLines();
}

function line(x){
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,canvas.height);
  ctx.stroke();
}

/* ---------- GOAL SIDE ---------- */

function drawGoalSide(x,dir,scale,mid,d13,d30){

  const small=4.5*scale;

  // BIG RECTANGLE (13m)
  ctx.strokeRect(x,mid-65,dir*d13,130);

  // SMALL SQUARE
  ctx.strokeRect(x,mid-30,dir*small,60);

  // 🔥 30m LINE (HORIZONTAL ACROSS)
  ctx.beginPath();
  ctx.moveTo(x + dir*d30, mid-65);
  ctx.lineTo(x + dir*d30, mid+65);
  ctx.stroke();

  // 🔥 CONNECTING LINE (THIS IS WHAT YOU WERE MISSING)
  ctx.beginPath();
  ctx.moveTo(x + dir*d13, mid-65);
  ctx.lineTo(x + dir*d30, mid-65);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x + dir*d13, mid+65);
  ctx.lineTo(x + dir*d30, mid+65);
  ctx.stroke();

  // 🔥 ARC (CORRECT POSITION)
  ctx.beginPath();
  ctx.arc(x + dir*d30, mid, 30*scale,
    dir===1?Math.PI/2:-Math.PI/2,
    dir===1?3*Math.PI/2:Math.PI/2
  );
  ctx.stroke();
}

/* ---------- DRAW TOOL ---------- */

let drawing=false, lines=[], current=[];

canvas.addEventListener("mousedown",e=>{
  if(mode!=="draw")return;
  drawing=true; current=[];
});

canvas.addEventListener("mousemove",e=>{
  if(!drawing)return;

  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left;
  const y=e.clientY-r.top;

  current.push({x,y});
  draw();

  ctx.beginPath();
  current.forEach((p,i)=>{
    i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);
  });
  ctx.stroke();
});

canvas.addEventListener("mouseup",()=>{
  if(!drawing)return;
  drawing=false;
  lines.push(current);
});

function drawLines(){
  lines.forEach(l=>{
    ctx.beginPath();
    l.forEach((p,i)=>{
      i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);
    });
    ctx.stroke();
  });
}

function undo(){lines.pop();draw();}
function clearLines(){lines=[];draw();}

/* ---------- PLAYERS ---------- */

const sidebar=document.getElementById("players");

for(let i=1;i<=15;i++){
  sidebar.appendChild(make(i,"green"));
  sidebar.appendChild(make(i,"blue"));
}

function make(n,c){
  const el=document.createElement("div");
  el.className="player "+c;
  el.innerText=n;

  let ox,oy;

  el.addEventListener("mousedown",e=>{
    if(mode!=="move")return;

    const r=el.getBoundingClientRect();
    ox=e.clientX-r.left;
    oy=e.clientY-r.top;

    el.style.position="absolute";

    function move(ev){
      el.style.left=ev.pageX-ox+"px";
      el.style.top=ev.pageY-oy+"px";
    }

    document.addEventListener("mousemove",move);

    document.addEventListener("mouseup",()=>{
      document.removeEventListener("mousemove",move);
    },{once:true});
  });

  return el;
}

/* ---------- INIT ---------- */

resize();
</script>

</body>
</html>
