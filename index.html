<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>GAA Tactics Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; display:flex; font-family:Arial; }

/* sidebar */
#sidebar {
  width:18%;
  background:#111;
  padding:10px;
  display:flex;
  flex-wrap:wrap;
}

.player {
  width:40px; height:40px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  margin:5px;
  font-weight:bold;
  cursor:grab;
  position:relative;
}

.green { background:lime; color:black; }
.blue { background:#2196f3; color:white; }

/* pitch */
#pitchWrap { width:82%; position:relative; }

#pitch {
  width:100%;
  height:100vh;
  background:#2e7d32;
  position:relative;
}

svg, canvas {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
}

/* toolbar */
#toolbar {
  position:absolute;
  top:10px;
  right:10px;
  z-index:10;
}
#toolbar button {
  margin-left:5px;
  padding:6px 10px;
  border:none;
  border-radius:4px;
  background:white;
  cursor:pointer;
}
</style>

</head>

<body>

<div id="sidebar"></div>

<div id="pitchWrap">

<div id="toolbar">
  <button onclick="toggleDraw()">Draw</button>
  <button onclick="clearDraw()">Clear</button>
</div>

<div id="pitch">

<!-- SVG PITCH -->

<svg>

<!-- OUTER -->

<rect x="20" y="20" width="calc(100% - 40px)" height="calc(100% - 40px)" stroke="white" fill="none"/>

<!-- HALF -->

<line x1="50%" y1="20" x2="50%" y2="calc(100% - 20px)" stroke="white"/>

<!-- 13 / 20 / 45 -->

<line x1="10%" y1="20" x2="10%" y2="calc(100% - 20px)" stroke="white"/>
<line x1="18%" y1="20" x2="18%" y2="calc(100% - 20px)" stroke="white"/>
<line x1="30%" y1="20" x2="30%" y2="calc(100% - 20px)" stroke="white"/>

<line x1="90%" y1="20" x2="90%" y2="calc(100% - 20px)" stroke="white"/>
<line x1="82%" y1="20" x2="82%" y2="calc(100% - 20px)" stroke="white"/>
<line x1="70%" y1="20" x2="70%" y2="calc(100% - 20px)" stroke="white"/>

<!-- GOALS -->

<rect x="20" y="45%" width="30" height="10%" stroke="white" fill="none"/>
<rect x="20" y="40%" width="80" height="20%" stroke="white" fill="none"/>

<rect x="calc(100% - 50px)" y="45%" width="30" height="10%" stroke="white" fill="none"/>
<rect x="calc(100% - 100px)" y="40%" width="80" height="20%" stroke="white" fill="none"/>

<!-- SMALL D (semi-circle) -->

<path d="M 100 40% A 80 80 0 0 1 100 60%" stroke="white" fill="none"/>
<path d="M calc(100% - 100px) 40% A 80 80 0 0 0 calc(100% - 100px) 60%" stroke="white" fill="none"/>

<!-- 40m ARC -->

<path d="M 180 30% A 160 160 0 0 1 180 70%" stroke="white" fill="none"/>
<path d="M calc(100% - 180px) 30% A 160 160 0 0 0 calc(100% - 180px) 70%" stroke="white" fill="none"/>

</svg>

<canvas id="drawCanvas"></canvas>

</div>
</div>

<script>
/* ---------- PLAYERS ---------- */
const sidebar = document.getElementById("sidebar");

function createPlayer(color, num){
  const p = document.createElement("div");
  p.className = "player " + color;
  p.innerText = num;

  let dragging = false;

  p.addEventListener("mousedown", (e)=>{
    e.stopPropagation();
    dragging = true;
    document.body.appendChild(p);
    move(e);
  });

  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", ()=> dragging=false);

  function move(e){
    if(!dragging) return;
    p.style.position = "absolute";
    p.style.left = (e.pageX - 20) + "px";
    p.style.top = (e.pageY - 20) + "px";
  }

  sidebar.appendChild(p);
}

for(let i=1;i<=15;i++){
  createPlayer("green", i);
  createPlayer("blue", i);
}

/* ---------- DRAWING ---------- */
const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");
const pitch = document.getElementById("pitch");

function resizeCanvas(){
  const rect = pitch.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let drawMode = false;
let drawing = false;

function toggleDraw(){
  drawMode = !drawMode;
}

canvas.addEventListener("mousedown", e=>{
  if(!drawMode) return;
  drawing = true;

  const rect = canvas.getBoundingClientRect();
  ctx.beginPath();
  ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
});

canvas.addEventListener("mousemove", e=>{
  if(!drawing) return;

  const rect = canvas.getBoundingClientRect();
  ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;
  ctx.stroke();
});

canvas.addEventListener("mouseup", ()=> drawing=false);

function clearDraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
}
</script>

</body>
</html>
