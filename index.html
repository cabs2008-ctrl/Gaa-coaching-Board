<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <title>GAA Tactics Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin:0; background:#2e7d32; font-family:Arial; }
    .player {
      position:absolute;
      width:35px;
      height:35px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
      cursor:pointer;
    }
    .green { background:lime; color:black; }
    .black { background:black; color:white; }
  </style>
</head>

<body>

<div id="pitch" style="width:100vw;height:100vh;position:relative;"></div>

<script>
const pitch = document.getElementById("pitch");

let players = [];

function createPlayers(color, offset=0){
  for(let i=0;i<15;i++){
    const p = document.createElement("div");
    p.className = "player " + color;
    p.innerText = i+1;
    p.style.left = (80 + (i%5)*100) + "px";
    p.style.top = (100 + Math.floor(i/5)*100 + offset) + "px";

    let dragging = false;

    p.onmousedown = () => dragging = true;
    document.onmouseup = () => dragging = false;
    document.onmousemove = (e) => {
      if(dragging){
        p.style.left = e.clientX - 15 + "px";
        p.style.top = e.clientY - 15 + "px";
      }
    };

    pitch.appendChild(p);
    players.push(p);
  }
}

createPlayers("green",0);
createPlayers("black",40);
</script>

</body>
</html>
