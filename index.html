<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAA Tactics Board</title>

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  background: #111;
  font-family: sans-serif;
}

.sidebar {
  width: 80px;
  background: #0d0d0d;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 10px;
}

.player {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  margin: 6px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  cursor: grab;
}

.green { background: #2ecc71; }
.blue { background: #3498db; color: white; }

.pitch-container {
  flex: 1;
  position: relative;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  background: linear-gradient(#2e7d32, #1b5e20);
}

.toolbar {
  position: absolute;
  top: 10px;
  right: 10px;
}

button {
  margin-left: 5px;
  padding: 6px 10px;
}
</style>
</head>

<body>

<div class="sidebar" id="players"></div>

<div class="pitch-container">
  <canvas id="pitch"></canvas>

  <div class="toolbar">
    <button onclick="setMode('move')">Move</button>
    <button onclick="setMode('draw')">Draw</button>
    <button onclick="undo()">Undo</button>
    <button onclick="clearLines()">Clear</button>
  </div>
</div>

<script>
const canvas = document.getElementById("pitch");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  drawPitch();
}
window.addEventListener("resize", resizeCanvas);

/* ---------- PITCH ---------- */

function drawPitch() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const w = canvas.width;
  const h = canvas.height;
  const mid = h / 2;

  ctx.strokeStyle = "white";
  ctx.lineWidth = 2;

  // Outer
  ctx.strokeRect(0, 0, w, h);

  // EVEN SPACING SYSTEM (THIS FIXES EVERYTHING)
  const sections = 8;
  const gap = w / sections;

  const lines = [
    gap,        // 13
    gap * 2,    // 20
    gap * 3,    // 45
    gap * 5,    // 45
    gap * 6,    // 20
    gap * 7     // 13
  ];

  lines.forEach(x => {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();
  });

  drawGoals(gap, mid);
  drawStoredLines();
}

/* ---------- GOALS ---------- */

function drawGoals(gap, mid) {

  // LEFT
  drawGoal(0, 1, gap, mid);

  // RIGHT
  drawGoal(canvas.width, -1, gap, mid);
}

function drawGoal(x, dir, gap, mid) {

  const big = gap * 0.9;
  const small = gap * 0.4;

  // Big box
  ctx.strokeRect(x, mid - 80, dir * big, 160);

  // Small box
  ctx.strokeRect(x, mid - 40, dir * small, 80);

  // Small D
  ctx.beginPath();
  ctx.arc(x + dir * small, mid, gap * 0.6,
    dir === 1 ? Math.PI/2 : -Math.PI/2,
    dir === 1 ? 3*Math.PI/2 : Math.PI/2
  );
  ctx.stroke();

  // ARC (touches 20 line visually)
  ctx.beginPath();
  ctx.arc(x, mid, gap * 2,
    dir === 1 ? Math.PI/2 : -Math.PI/2,
    dir === 1 ? 3*Math.PI/2 : Math.PI/2
  );
  ctx.stroke();
}

/* ---------- DRAW ---------- */

let mode = "move";
let drawing = false;
let lines = [];
let current = [];

canvas.addEventListener("mousedown", e => {
  if (mode !== "draw") return;
  drawing = true;
  current = [];
});

canvas.addEventListener("mousemove", e => {
  if (!drawing) return;

  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  current.push({x, y});
  drawPitch();

  ctx.beginPath();
  current.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.stroke();
});

canvas.addEventListener("mouseup", () => {
  if (!drawing) return;
  drawing = false;
  lines.push(current);
});

function drawStoredLines() {
  lines.forEach(line => {
    ctx.beginPath();
    line.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
  });
}

function undo() {
  lines.pop();
  drawPitch();
}

function clearLines() {
  lines = [];
  drawPitch();
}

/* ---------- PLAYERS ---------- */

const sidebar = document.getElementById("players");

for (let i = 1; i <= 15; i++) {
  sidebar.appendChild(makePlayer(i, "green"));
  sidebar.appendChild(makePlayer(i, "blue"));
}

function makePlayer(num, color) {
  const el = document.createElement("div");
  el.className = "player " + color;
  el.innerText = num;

  let offsetX, offsetY;

  el.addEventListener("mousedown", e => {
    if (mode !== "move") return;

    const rect = el.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    el.style.position = "absolute";

    function move(ev) {
      el.style.left = ev.pageX - offsetX + "px";
      el.style.top = ev.pageY - offsetY + "px";
    }

    document.addEventListener("mousemove", move);

    document.addEventListener("mouseup", () => {
      document.removeEventListener("mousemove", move);
    }, { once: true });
  });

  return el;
}

/* ---------- MODE ---------- */

function setMode(m) {
  mode = m;
}

/* ---------- INIT ---------- */

resizeCanvas();
</script>

</body>
</html>
