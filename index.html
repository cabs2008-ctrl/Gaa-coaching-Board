<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAA Tactics Board</title>

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  background: #111;
  font-family: sans-serif;
}

/* SIDEBAR */
.sidebar {
  width: 80px;
  background: #0d0d0d;
  padding-top: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-y: auto;
}

.player {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  margin: 6px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  cursor: grab;
}

.green { background: #2ecc71; }
.blue { background: #3498db; color: white; }

/* PITCH */
.pitch-container {
  flex: 1;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

canvas {
  background: linear-gradient(#2e7d32, #1b5e20);
  border: 2px solid white;
}

/* TOOLBAR */
.toolbar {
  position: absolute;
  top: 10px;
  right: 10px;
}

button {
  margin-left: 5px;
  padding: 6px 10px;
}
</style>
</head>

<body>

<div class="sidebar" id="players"></div>

<div class="pitch-container">
  <canvas id="pitch"></canvas>

  <div class="toolbar">
    <button onclick="setMode('move')">Move</button>
    <button onclick="setMode('draw')">Draw</button>
    <button onclick="undo()">Undo</button>
    <button onclick="clearAll()">Clear</button>
  </div>
</div>

<script>
const canvas = document.getElementById("pitch");
const ctx = canvas.getContext("2d");

canvas.width = 1000;
canvas.height = 500;

/* ---------------- MODE ---------------- */

let mode = "move";
function setMode(m) {
  mode = m;
}

/* ---------------- DRAW PITCH ---------------- */

function drawPitch() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const w = canvas.width;
  const h = canvas.height;

  ctx.strokeStyle = "white";
  ctx.lineWidth = 2;

  // Outer
  ctx.strokeRect(0, 0, w, h);

  // GAA lines
  const lines = [
    w * 0.13,
    w * 0.20,
    w * 0.45,
    w * 0.55,
    w * 0.80,
    w * 0.87
  ];

  lines.forEach(x => {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();
  });

  drawGoals();
  drawAllLines();
}

/* ---------------- GOALS ---------------- */

function drawGoals() {
  drawGoal(0, 1);
  drawGoal(canvas.width, -1);
}

function drawGoal(x, dir) {
  const mid = canvas.height / 2;

  const big = 80;
  const small = 40;

  // Big box
  ctx.strokeRect(x, mid - 100, dir * big, 200);

  // Small box
  ctx.strokeRect(x, mid - 50, dir * small, 100);

  // Small D
  ctx.beginPath();
  ctx.arc(x + dir * big, mid, 35,
    dir === 1 ? Math.PI/2 : -Math.PI/2,
    dir === 1 ? 3*Math.PI/2 : Math.PI/2
  );
  ctx.stroke();

  // 40m arc
  ctx.beginPath();
  ctx.arc(x, mid, 140,
    dir === 1 ? Math.PI/2 : -Math.PI/2,
    dir === 1 ? 3*Math.PI/2 : Math.PI/2
  );
  ctx.stroke();
}

/* ---------------- DRAWING ---------------- */

let drawing = false;
let lines = [];
let current = [];

canvas.addEventListener("mousedown", e => {
  if (mode !== "draw") return;
  drawing = true;
  current = [];
});

canvas.addEventListener("mousemove", e => {
  if (!drawing) return;

  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  current.push({x, y});
  drawPitch();

  ctx.beginPath();
  current.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.stroke();
});

canvas.addEventListener("mouseup", () => {
  if (!drawing) return;
  drawing = false;
  lines.push(current);
});

function drawAllLines() {
  lines.forEach(line => {
    ctx.beginPath();
    line.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
  });
}

function undo() {
  lines.pop();
  drawPitch();
}

function clearAll() {
  lines = [];
  drawPitch();
}

/* ---------------- PLAYERS ---------------- */

const sidebar = document.getElementById("players");

for (let i = 1; i <= 15; i++) {
  sidebar.appendChild(createPlayer(i, "green"));
  sidebar.appendChild(createPlayer(i, "blue"));
}

function createPlayer(num, color) {
  const el = document.createElement("div");
  el.className = "player " + color;
  el.innerText = num;

  let offsetX, offsetY;

  el.addEventListener("mousedown", e => {
    if (mode !== "move") return;

    const rect = el.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    el.style.position = "absolute";

    function move(ev) {
      el.style.left = ev.pageX - offsetX + "px";
      el.style.top = ev.pageY - offsetY + "px";
    }

    document.addEventListener("mousemove", move);

    document.addEventListener("mouseup", () => {
      document.removeEventListener("mousemove", move);
    }, { once: true });
  });

  return el;
}

/* ---------------- INIT ---------------- */

drawPitch();
</script>

</body>
</html>
