<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAA Tactics Board</title>

<style>
body {
  margin: 0;
  background: #111;
  font-family: sans-serif;
  overflow: hidden;
}

.container {
  display: flex;
  height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 90px;
  background: #0d0d0d;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 5px;
  overflow-y: auto;
}

.player {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  margin: 6px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  cursor: grab;
}

.green { background: #2ecc71; color: #000; }
.blue { background: #3498db; color: #fff; }

/* PITCH */
.pitch-container {
  flex: 1;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

canvas {
  background: linear-gradient(#2e7d32, #1b5e20);
  border: 2px solid white;
}

/* TOOLBAR */
.toolbar {
  position: absolute;
  top: 10px;
  right: 10px;
}

button {
  margin-left: 5px;
  padding: 6px 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

<!-- PLAYERS -->
<div class="sidebar" id="sidebar"></div>

<!-- PITCH -->
<div class="pitch-container">
  <canvas id="pitch" width="1000" height="500"></canvas>

  <div class="toolbar">
    <button onclick="mode='draw'">Draw</button>
    <button onclick="mode='move'">Move</button>
    <button onclick="undo()">Undo</button>
    <button onclick="clearDraw()">Clear</button>
  </div>
</div>

</div>

<script>
const canvas = document.getElementById("pitch");
const ctx = canvas.getContext("2d");

let mode = "move";
let drawing = false;
let currentLine = [];
let lines = [];

let players = [];

/* =========================
   CREATE PLAYERS
========================= */
const sidebar = document.getElementById("sidebar");

for (let i = 1; i <= 15; i++) {
  createPlayer(i, "green");
  createPlayer(i, "blue");
}

function createPlayer(num, color) {
  const el = document.createElement("div");
  el.className = "player " + color;
  el.innerText = num;

  el.onmousedown = (e) => startDrag(e, el);

  sidebar.appendChild(el);
}

/* =========================
   DRAG SYSTEM (FIXED)
========================= */
let dragging = null;

function startDrag(e, el) {
  if (mode !== "move") return;

  dragging = el;

  const rect = canvas.getBoundingClientRect();

  el.style.position = "absolute";
  el.style.left = (e.clientX - rect.left - 20) + "px";
  el.style.top = (e.clientY - rect.top - 20) + "px";

  document.body.appendChild(el);
}

document.onmousemove = (e) => {
  if (!dragging) return;

  const rect = canvas.getBoundingClientRect();

  dragging.style.left = (e.clientX - rect.left - 20) + "px";
  dragging.style.top = (e.clientY - rect.top - 20) + "px";
};

document.onmouseup = () => {
  dragging = null;
};

/* =========================
   DRAW SYSTEM (FIXED)
========================= */
canvas.onmousedown = (e) => {
  if (mode !== "draw") return;

  drawing = true;
  currentLine = [];

  const pos = getMouse(e);
  currentLine.push(pos);
};

canvas.onmousemove = (e) => {
  if (!drawing) return;

  const pos = getMouse(e);
  currentLine.push(pos);

  redraw();
};

canvas.onmouseup = () => {
  if (!drawing) return;

  drawing = false;
  lines.push(currentLine);
};

/* FIXED mouse alignment */
function getMouse(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

/* =========================
   DRAW PITCH (GAA)
========================= */
function drawPitch() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "white";
  ctx.lineWidth = 2;

  const w = canvas.width;
  const h = canvas.height;

  // outer
  ctx.strokeRect(0, 0, w, h);

  // lines (correct order)
  drawLine(0.13);
  drawLine(0.20);
  drawLine(0.45);
  drawLine(1 - 0.45);
  drawLine(1 - 0.20);
  drawLine(1 - 0.13);

  function drawLine(pos) {
    ctx.beginPath();
    ctx.moveTo(w * pos, 0);
    ctx.lineTo(w * pos, h);
    ctx.stroke();
  }

  // goals
  drawGoals(0);
  drawGoals(w);

  function drawGoals(x) {
    const dir = x === 0 ? 1 : -1;

    // small box
    ctx.strokeRect(x, h/2 - 40, dir*60, 80);

    // big box
    ctx.strokeRect(x, h/2 - 80, dir*120, 160);

    // semicircle (D)
    ctx.beginPath();
    ctx.arc(x + dir*120, h/2, 80, Math.PI/2, -Math.PI/2, x!==0);
    ctx.stroke();

    // 40m arc (touching 20m line)
    ctx.beginPath();
    ctx.arc(x + dir*(w*0.20), h/2, 120, Math.PI/2, -Math.PI/2, x!==0);
    ctx.stroke();
  }
}

/* =========================
   DRAW LINES
========================= */
function redraw() {
  drawPitch();

  ctx.lineWidth = 3;
  ctx.strokeStyle = "white";

  lines.forEach(line => {
    ctx.beginPath();
    ctx.moveTo(line[0].x, line[0].y);
    line.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.stroke();
  });

  // current line
  if (currentLine.length > 0) {
    ctx.beginPath();
    ctx.moveTo(currentLine[0].x, currentLine[0].y);
    currentLine.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.stroke();
  }
}

/* =========================
   TOOLS
========================= */
function undo() {
  lines.pop();
  redraw();
}

function clearDraw() {
  lines = [];
  redraw();
}

/* INIT */
drawPitch();
</script>

</body>
</html>
