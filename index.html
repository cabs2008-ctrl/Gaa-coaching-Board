<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>GAA Tactics Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin:0; background:#2e7d32; }
  .player {
    position:absolute;
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    user-select:none;
    cursor:grab;
  }
  .green { background:lime; color:black; }
  .black { background:black; color:white; }
</style>
</head>

<body>

<div id="pitch" style="width:100vw;height:100vh;position:relative;"></div>

<script>
const pitch = document.getElementById("pitch");

function createPlayer(x,y,color,num){
  const p = document.createElement("div");
  p.className = "player " + color;
  p.innerText = num;
  p.style.left = x + "px";
  p.style.top = y + "px";

  let offsetX, offsetY, dragging = false;

  p.addEventListener("mousedown", (e)=>{
    dragging = true;
    offsetX = e.offsetX;
    offsetY = e.offsetY;
  });

  document.addEventListener("mouseup", ()=>{
    dragging = false;
  });

  document.addEventListener("mousemove", (e)=>{
    if(dragging){
      p.style.left = (e.clientX - offsetX) + "px";
      p.style.top = (e.clientY - offsetY) + "px";
    }
  });

  pitch.appendChild(p);
}

// Create teams
for(let i=0;i<15;i++){
  createPlayer(100 + (i%5)*100, 100 + Math.floor(i/5)*100, "green", i+1);
  createPlayer(100 + (i%5)*100, 300 + Math.floor(i/5)*100, "black", i+1);
}
</script>

</body>
</html>
