<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAA Tactics Board</title>

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  background: #111;
  font-family: sans-serif;
}

.sidebar {
  width: 80px;
  background: #0d0d0d;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 10px;
}

.player {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  margin: 6px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  cursor: grab;
}

.green { background: #2ecc71; }
.blue { background: #3498db; color: white; }

.pitch-container {
  flex: 1;
  position: relative;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  background: #1b5e20;
}

.toolbar {
  position: absolute;
  top: 10px;
  right: 10px;
}

button {
  margin-left: 5px;
  padding: 6px 10px;
}
</style>
</head>

<body>

<div class="sidebar" id="players"></div>

<div class="pitch-container">
  <canvas id="pitch"></canvas>

  <div class="toolbar">
    <button onclick="setMode('move')">Move</button>
    <button onclick="setMode('draw')">Draw</button>
    <button onclick="undo()">Undo</button>
    <button onclick="clearLines()">Clear</button>
  </div>
</div>

<script>
const canvas = document.getElementById("pitch");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  drawPitch();
}

window.addEventListener("resize", resizeCanvas);

/* ---------- DRAW PITCH ---------- */

function drawPitch() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const margin = 40;

  const pitchX = margin;
  const pitchY = margin;
  const pitchW = canvas.width - margin * 2;
  const pitchH = canvas.height - margin * 2;

  const scale = pitchW / 145; // real pitch length

  ctx.strokeStyle = "white";
  ctx.lineWidth = 2;

  // Outer pitch
  ctx.strokeRect(pitchX, pitchY, pitchW, pitchH);

  const d13 = 13 * scale;
  const d20 = 20 * scale;
  const d45 = 45 * scale;

  // LEFT
  drawLine(pitchX + d13, pitchY, pitchH);
  drawLine(pitchX + d20, pitchY, pitchH);
  drawLine(pitchX + d45, pitchY, pitchH);

  // RIGHT
  drawLine(pitchX + pitchW - d13, pitchY, pitchH);
  drawLine(pitchX + pitchW - d20, pitchY, pitchH);
  drawLine(pitchX + pitchW - d45, pitchY, pitchH);

  drawGoals(pitchX, pitchY, pitchW, pitchH, scale);
  drawStoredLines();
}

function drawLine(x, y, h) {
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x, y + h);
  ctx.stroke();
}

/* ---------- GOALS ---------- */

function drawGoals(px, py, pw, ph, scale) {
  drawGoal(px, py, ph, 1, scale);
  drawGoal(px + pw, py, ph, -1, scale);
}

function drawGoal(x, py, ph, dir, scale) {
  const mid = py + ph / 2;

  const small = 4.5 * scale;
  const big = 13 * scale;

  // Big box
  ctx.strokeRect(x, mid - 65, dir * big, 130);

  // Small box
  ctx.strokeRect(x, mid - 30, dir * small, 60);

  // Small D
  ctx.beginPath();
  ctx.arc(x + dir * small, mid, 13 * scale,
    dir === 1 ? Math.PI/2 : -Math.PI/2,
    dir === 1 ? 3*Math.PI/2 : Math.PI/2
  );
  ctx.stroke();

  // 20m arc
  ctx.beginPath();
  ctx.arc(x, mid, 20 * scale,
    dir === 1 ? Math.PI/2 : -Math.PI/2,
    dir === 1 ? 3*Math.PI/2 : Math.PI/2
  );
  ctx.stroke();
}

/* ---------- DRAW ---------- */

let mode = "move";
let drawing = false;
let lines = [];
let current = [];

canvas.addEventListener("mousedown", e => {
  if (mode !== "draw") return;
  drawing = true;
  current = [];
});

canvas.addEventListener("mousemove", e => {
  if (!drawing) return;

  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  current.push({x, y});
  drawPitch();

  ctx.beginPath();
  current.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.stroke();
});

canvas.addEventListener("mouseup", () => {
  if (!drawing) return;
  drawing = false;
  lines.push(current);
});

function drawStoredLines() {
  lines.forEach(line => {
    ctx.beginPath();
    line.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
  });
}

function undo() {
  lines.pop();
  drawPitch();
}

function clearLines() {
  lines = [];
  drawPitch();
}

/* ---------- PLAYERS ---------- */

const sidebar = document.getElementById("players");

for (let i = 1; i <= 15; i++) {
  sidebar.appendChild(makePlayer(i, "green"));
  sidebar.appendChild(makePlayer(i, "blue"));
}

function makePlayer(num, color) {
  const el = document.createElement("div");
  el.className = "player " + color;
  el.innerText = num;

  let offsetX, offsetY;

  el.addEventListener("mousedown", e => {
    if (mode !== "move") return;

    const rect = el.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    el.style.position = "absolute";

    function move(ev) {
      el.style.left = ev.pageX - offsetX + "px";
      el.style.top = ev.pageY - offsetY + "px";
    }

    document.addEventListener("mousemove", move);

    document.addEventListener("mouseup", () => {
      document.removeEventListener("mousemove", move);
    }, { once: true });
  });

  return el;
}

/* ---------- MODE ---------- */

function setMode(m) {
  mode = m;
}

/* ---------- INIT ---------- */

resizeCanvas();
</script>

</body>
</html>
