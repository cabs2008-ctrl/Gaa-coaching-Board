<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>GAA Tactics Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; display:flex; font-family:Arial; }

#sidebar {
  width:20%;
  background:#111;
  padding:10px;
  display:flex;
  flex-wrap:wrap;
}

.player {
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:5px;
  font-weight:bold;
  cursor:grab;
}

.green { background:lime; color:black; }
.blue { background:#2196f3; color:white; }

#pitch {
  width:80%;
  height:100vh;
  background:#2e7d32;
  position:relative;
}

svg { width:100%; height:100%; }
text { fill:white; font-size:14px; }
</style>

</head>

<body>

<div id="sidebar"></div>

<div id="pitch">

<svg>

  <!-- Outer -->

  <rect x="20" y="20" width="calc(100% - 40px)" height="calc(100% - 40px)" stroke="white" fill="none"/>

  <!-- Halfway -->

  <line x1="50%" y1="20" x2="50%" y2="calc(100% - 20px)" stroke="white"/>

  <!-- 45m lines -->

  <line x1="25%" y1="20" x2="25%" y2="calc(100% - 20px)" stroke="white"/>
  <line x1="75%" y1="20" x2="75%" y2="calc(100% - 20px)" stroke="white"/>

  <!-- 20m lines -->

  <line x1="35%" y1="20" x2="35%" y2="calc(100% - 20px)" stroke="white"/>
  <line x1="65%" y1="20" x2="65%" y2="calc(100% - 20px)" stroke="white"/>

  <!-- 13m lines -->

  <line x1="42%" y1="20" x2="42%" y2="calc(100% - 20px)" stroke="white"/>
  <line x1="58%" y1="20" x2="58%" y2="calc(100% - 20px)" stroke="white"/>

  <!-- LEFT GOAL -->

  <line x1="20" y1="50%" x2="35" y2="50%" stroke="white"/>
  <rect x="20" y="45%" width="35" height="10%" stroke="white" fill="none"/>
  <rect x="20" y="40%" width="70" height="20%" stroke="white" fill="none"/>

  <!-- RIGHT GOAL -->

  <line x1="calc(100% - 20px)" y1="50%" x2="calc(100% - 35px)" y2="50%" stroke="white"/>
  <rect x="calc(100% - 55px)" y="45%" width="35" height="10%" stroke="white" fill="none"/>
  <rect x="calc(100% - 90px)" y="40%" width="70" height="20%" stroke="white" fill="none"/>

  <!-- SMALL D (20m semi-circle) -->

  <path d="M 90 40% A 60 60 0 0 1 90 60%" stroke="white" fill="none"/>
  <path d="M calc(100% - 90px) 40% A 60 60 0 0 0 calc(100% - 90px) 60%" stroke="white" fill="none"/>

  <!-- 40m arcs -->

  <path d="M 150 25% A 150 150 0 0 1 150 75%" stroke="white" fill="none"/>
  <path d="M calc(100% - 150px) 25% A 150 150 0 0 0 calc(100% - 150px) 75%" stroke="white" fill="none"/>

  <!-- SIDELINE LABELS -->

<text x="26%" y="18">45</text> <text x="36%" y="18">20</text> <text x="43%" y="18">13</text>

<text x="74%" y="18">45</text> <text x="64%" y="18">20</text> <text x="57%" y="18">13</text>

</svg>

</div>

<script>
const sidebar = document.getElementById("sidebar");

function createPlayer(color, num){
  const p = document.createElement("div");
  p.className = "player " + color;
  p.innerText = num;

  let dragging = false;

  p.addEventListener("mousedown", (e)=>{
    dragging = true;
    document.body.appendChild(p);
    move(e);
  });

  document.addEventListener("mouseup", ()=> dragging=false);
  document.addEventListener("mousemove", move);

  function move(e){
    if(!dragging) return;
    p.style.position = "absolute";
    p.style.left = e.pageX - 20 + "px";
    p.style.top = e.pageY - 20 + "px";
  }

  sidebar.appendChild(p);
}

for(let i=1;i<=15;i++){
  createPlayer("green", i);
  createPlayer("blue", i);
}
</script>

</body>
</html>
