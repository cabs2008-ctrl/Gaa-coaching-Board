<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAA Tactics Board</title>

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  background: #111;
  font-family: sans-serif;
}

.sidebar {
  width: 80px;
  background: #0d0d0d;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 10px;
}

.player {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  margin: 6px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  cursor: grab;
}

.green { background: #2ecc71; }
.blue { background: #3498db; color: white; }

.pitch-container {
  flex: 1;
  position: relative;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  background: linear-gradient(#2e7d32, #1b5e20);
}

.toolbar {
  position: absolute;
  top: 10px;
  right: 10px;
}
</style>
</head>

<body>

<div class="sidebar" id="players"></div>

<div class="pitch-container">
  <canvas id="pitch"></canvas>

  <div class="toolbar">
    <button onclick="mode='move'">Move</button>
    <button onclick="mode='draw'">Draw</button>
    <button onclick="undo()">Undo</button>
    <button onclick="clearLines()">Clear</button>
  </div>
</div>

<script>
const canvas = document.getElementById("pitch");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  drawPitch();
}
window.addEventListener("resize", resizeCanvas);

let mode = "move";

/* ---------- PITCH ---------- */

function drawPitch() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const w = canvas.width;
  const h = canvas.height;
  const mid = h/2;

  ctx.strokeStyle = "white";
  ctx.lineWidth = 2;

  // Outer
  ctx.strokeRect(0,0,w,h);

  // SCALE (simple visual)
  const scale = w / 100;

  const line20 = 20 * scale;
  const line30 = 30 * scale;

  // LEFT SIDE ONLY (mirror happens automatically visually)
  drawLine(line20);
  drawLine(line30);

  // RIGHT SIDE
  drawLine(w - line20);
  drawLine(w - line30);

  drawGoals(scale, mid);
  drawStoredLines();
}

function drawLine(x){
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,canvas.height);
  ctx.stroke();
}

/* ---------- GOALS ---------- */

function drawGoals(scale, mid){

  drawGoal(0,1,scale,mid);
  drawGoal(canvas.width,-1,scale,mid);
}

function drawGoal(x,dir,scale,mid){

  const small = 4 * scale;
  const big = 14 * scale;

  // Big rectangle (your 30m zone)
  ctx.strokeRect(x, mid-80, dir*big, 160);

  // Small square
  ctx.strokeRect(x, mid-35, dir*small, 70);

  // Semi circle
  ctx.beginPath();
  ctx.arc(x + dir*small, mid, 12*scale,
    dir===1?Math.PI/2:-Math.PI/2,
    dir===1?3*Math.PI/2:Math.PI/2
  );
  ctx.stroke();
}

/* ---------- DRAW ---------- */

let drawing=false, lines=[], current=[];

canvas.addEventListener("mousedown",e=>{
  if(mode!=="draw")return;
  drawing=true;
  current=[];
});

canvas.addEventListener("mousemove",e=>{
  if(!drawing)return;

  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left;
  const y=e.clientY-r.top;

  current.push({x,y});
  drawPitch();

  ctx.beginPath();
  current.forEach((p,i)=>{
    i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);
  });
  ctx.stroke();
});

canvas.addEventListener("mouseup",()=>{
  if(!drawing)return;
  drawing=false;
  lines.push(current);
});

function drawStoredLines(){
  lines.forEach(line=>{
    ctx.beginPath();
    line.forEach((p,i)=>{
      i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);
    });
    ctx.stroke();
  });
}

function undo(){ lines.pop(); drawPitch(); }
function clearLines(){ lines=[]; drawPitch(); }

/* ---------- PLAYERS ---------- */

const sidebar=document.getElementById("players");

for(let i=1;i<=15;i++){
  sidebar.appendChild(makePlayer(i,"green"));
  sidebar.appendChild(makePlayer(i,"blue"));
}

function makePlayer(num,color){
  const el=document.createElement("div");
  el.className="player "+color;
  el.innerText=num;

  let ox,oy;

  el.addEventListener("mousedown",e=>{
    if(mode!=="move")return;

    const r=el.getBoundingClientRect();
    ox=e.clientX-r.left;
    oy=e.clientY-r.top;

    el.style.position="absolute";

    function move(ev){
      el.style.left=ev.pageX-ox+"px";
      el.style.top=ev.pageY-oy+"px";
    }

    document.addEventListener("mousemove",move);

    document.addEventListener("mouseup",()=>{
      document.removeEventListener("mousemove",move);
    },{once:true});
  });

  return el;
}

/* ---------- INIT ---------- */

resizeCanvas();
</script>

</body>
</html>
