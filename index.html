<script>
const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");

// FIX SIZE (important for scaling)
canvas.width = 1000;
canvas.height = 500;

function drawPitch() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const w = canvas.width;
  const h = canvas.height;

  ctx.strokeStyle = "white";
  ctx.lineWidth = 2;

  // OUTER BORDER
  ctx.strokeRect(0, 0, w, h);

  // GAA LINES (correct order from goal out)
  const left13 = w * 0.13;
  const left20 = w * 0.20;
  const left45 = w * 0.45;

  const right13 = w * 0.87;
  const right20 = w * 0.80;
  const right45 = w * 0.55;

  [left13, left20, left45, right45, right20, right13].forEach(x => {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();
  });

  // GOALS
  drawGoal(0, false);
  drawGoal(w, true);
}

function drawGoal(edgeX, isRight) {
  const h = canvas.height;
  const goalY = h / 2;

  const bigW = 80;
  const smallW = 40;

  const x = isRight ? edgeX - bigW : edgeX;

  // BIG RECTANGLE
  ctx.strokeRect(x, goalY - 100, bigW, 200);

  // SMALL RECTANGLE
  ctx.strokeRect(
    isRight ? edgeX - smallW : edgeX,
    goalY - 50,
    smallW,
    100
  );

  // SMALL D (semi circle)
  ctx.beginPath();
  ctx.arc(
    isRight ? x : x + bigW,
    goalY,
    40,
    isRight ? -Math.PI / 2 : Math.PI / 2,
    isRight ? Math.PI / 2 : (3 * Math.PI) / 2
  );
  ctx.stroke();

  // 40m ARC (touching 20m line visually)
  ctx.beginPath();
  ctx.arc(
    isRight ? x : x + bigW,
    goalY,
    100,
    isRight ? -Math.PI / 2 : Math.PI / 2,
    isRight ? Math.PI / 2 : (3 * Math.PI) / 2
  );
  ctx.stroke();
}

drawPitch();
</script>
