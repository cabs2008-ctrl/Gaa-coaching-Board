<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>GAA Tactics Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; display:flex; font-family:Arial; }

/* LEFT: players */
#sidebar{
  width:18%;
  background:#111;
  padding:8px;
  display:flex;
  flex-wrap:wrap;
  align-content:flex-start;
}
.player{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin:5px;font-weight:bold;cursor:grab;user-select:none;
}
.green{background:lime;color:black;}
.blue{background:#2196f3;color:white;}

/* RIGHT: pitch */
#pitchWrap{ width:82%; position:relative; background:#2e7d32; }
#pitch{ position:relative; width:100%; height:100vh; }
svg{ position:absolute; width:100%; height:100%; }

/* toolbar */
#toolbar{
  position:absolute; top:10px; right:10px; z-index:5;
}
#toolbar button{
  margin-left:6px; padding:6px 10px; border:none; border-radius:4px;
  background:#ffffffcc; cursor:pointer; font-weight:600;
}

/* drawing layer */
#drawLayer{
  position:absolute; inset:0; pointer-events:none;
}
</style>

</head>

<body>

<div id="sidebar"></div>

<div id="pitchWrap">
  <div id="toolbar">
    <button onclick="toggleDraw()">✏️ Draw</button>
    <button onclick="undo()">Undo</button>
    <button onclick="clearDraw()">Clear</button>
    <button onclick="exportImg()">Export</button>
  </div>

  <div id="pitch">
    <svg id="pitchSvg">
      <!-- Outer -->
      <rect x="20" y="20" width="calc(100% - 40px)" height="calc(100% - 40px)" stroke="white" fill="none"/>

```
  <!-- Halfway -->
  <line x1="50%" y1="20" x2="50%" y2="calc(100% - 20px)" stroke="white"/>

  <!-- ORDER from LEFT goal: 13m -> 20m -> 45m -->
  <!-- Left side lines -->
  <line x1="10%" y1="20" x2="10%" y2="calc(100% - 20px)" stroke="white"/>  <!-- 13 -->
  <line x1="18%" y1="20" x2="18%" y2="calc(100% - 20px)" stroke="white"/>  <!-- 20 -->
  <line x1="30%" y1="20" x2="30%" y2="calc(100% - 20px)" stroke="white"/>  <!-- 45 -->

  <!-- Right side lines (mirror) -->
  <line x1="90%" y1="20" x2="90%" y2="calc(100% - 20px)" stroke="white"/>  <!-- 13 -->
  <line x1="82%" y1="20" x2="82%" y2="calc(100% - 20px)" stroke="white"/>  <!-- 20 -->
  <line x1="70%" y1="20" x2="70%" y2="calc(100% - 20px)" stroke="white"/>  <!-- 45 -->

  <!-- LEFT goal + squares -->

  </div>
</div>

<script>
/* players */
const sidebar=document.getElementById("sidebar");
function createPlayer(color,num){
  const p=document.createElement("div");
  p.className="player "+color;
  p.innerText=num;

  let drag=false;
  p.onmousedown=e=>{
    drag=true; document.body.appendChild(p);
    move(e);
  };
  document.onmouseup=()=>drag=false;
  document.onmousemove=move;

  function move(e){
    if(!drag)return;
    p.style.position="absolute";
    p.style.left=e.pageX-20+"px";
    p.style.top=e.pageY-20+"px";
  }

  sidebar.appendChild(p);
}
for(let i=1;i<=15;i++){
  createPlayer("green",i);
  createPlayer("blue",i);
}

/* drawing */
const canvas=document.getElementById("drawLayer");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let drawing=false, enabled=false, paths=[];

function toggleDraw(){ enabled=!enabled; }

canvas.addEventListener("mousedown",e=>{
  if(!enabled)return;
  drawing=true;
  ctx.beginPath();
  ctx.moveTo(e.offsetX,e.offsetY);
});

canvas.addEventListener("mousemove",e=>{
  if(!drawing)return;
  ctx.lineTo(e.offsetX,e.offsetY);
  ctx.strokeStyle="white";
  ctx.lineWidth=3;
  ctx.stroke();
});

canvas.addEventListener("mouseup",()=>{
  if(drawing){ paths.push(true); }
  drawing=false;
});

function undo(){
  if(paths.length===0)return;
  paths.pop();
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function clearDraw(){
  paths=[]; ctx.clearRect(0,0,canvas.width,canvas.height);
}

function exportImg(){
  html2canvas(document.body).then(c=>{
    const link=document.createElement("a");
    link.download="tactic.png";
    link.href=c.toDataURL();
    link.click();
  });
}
</script>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

</body>
</html>
