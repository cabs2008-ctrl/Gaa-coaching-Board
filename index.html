<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAA Tactics Board</title>

<style>
body { margin:0; display:flex; background:#111; color:white; font-family:sans-serif; }

#sidebar {
  width:120px;
  background:#000;
  padding:10px;
}

.player {
  width:40px;
  height:40px;
  border-radius:50%;
  margin:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  cursor:pointer;
}

.green { background:#2ecc71; }
.blue { background:#3498db; }

#topbar {
  position:absolute;
  top:10px;
  right:10px;
  z-index:10;
}

button {
  margin:2px;
  padding:6px 10px;
}

canvas {
  flex:1;
  background:#0b6623;
}
</style>
</head>

<body>

<div id="sidebar"></div>

<div id="topbar">
  <button onclick="drawMode=true">Draw</button>
  <button onclick="drawMode=false">Move</button>
  <button onclick="undoLine()">Undo</button>
  <button onclick="clearAll()">Clear</button>
  <button onclick="savePlay()">Save</button>
  <button onclick="loadPlay()">Load</button>
  <button onclick="exportImage()">Export</button>
</div>

<canvas id="pitch"></canvas>

<script>
const canvas = document.getElementById("pitch");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth - 120;
canvas.height = window.innerHeight;

let players = [];
let drawings = [];
let currentLine = [];

let draggingPlayer = null;
let drawMode = false;

// -------- PLAYERS --------
const sidebar = document.getElementById("sidebar");

for (let i = 1; i <= 15; i++) {
  let p = document.createElement("div");
  p.className = "player green";
  p.innerText = i;

  p.onclick = () => {
    players.push({ id:i, x:200, y:100 + i*20 });
    drawAll();
  };

  sidebar.appendChild(p);
}

for (let i = 1; i <= 15; i++) {
  let p = document.createElement("div");
  p.className = "player blue";
  p.innerText = i;

  p.onclick = () => {
    players.push({ id:i, x:300, y:100 + i*20 });
    drawAll();
  };

  sidebar.appendChild(p);
}

// -------- SNAP --------
const SNAP = 10;
function snap(v){ return Math.round(v/SNAP)*SNAP; }

// -------- DRAG --------
canvas.addEventListener("mousedown", (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  if (!drawMode) {
    players.forEach(p => {
      if (Math.hypot(p.x-x, p.y-y) < 20) {
        draggingPlayer = p;
      }
    });
  } else {
    currentLine = [];
  }
});

canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  if (draggingPlayer) {
    draggingPlayer.x = snap(x);
    draggingPlayer.y = snap(y);
    drawAll();
  }

  if (drawMode && e.buttons === 1) {
    currentLine.push({x,y});
    drawAll();
  }
});

canvas.addEventListener("mouseup", () => {
  if (draggingPlayer) draggingPlayer = null;

  if (drawMode && currentLine.length) {
    drawings.push(currentLine);
  }
});

// -------- DRAW --------
function drawAll(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawPitch();
  drawLines();
  drawPlayers();
}

// -------- PITCH (basic GA lines kept same) --------
function drawPitch(){
  ctx.strokeStyle="white";
  ctx.lineWidth=2;

  // border
  ctx.strokeRect(0,0,canvas.width,canvas.height);

  // lines
  const lines = [0.2,0.3,0.5,0.7,0.8];
  lines.forEach(l=>{
    let x = canvas.width*l;
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,canvas.height);
    ctx.stroke();
  });

  // goals
  ctx.strokeRect(0, canvas.height/2-50, 80,100);
  ctx.strokeRect(canvas.width-80, canvas.height/2-50, 80,100);
}

// -------- PLAYERS --------
function drawPlayers(){
  players.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,15,0,Math.PI*2);
    ctx.fillStyle = "blue";
    ctx.fill();

    ctx.fillStyle="white";
    ctx.fillText(p.id, p.x-5, p.y+5);
  });
}

// -------- DRAWING --------
function drawLines(){
  ctx.strokeStyle="white";
  ctx.lineWidth=3;

  drawings.forEach(line=>{
    ctx.beginPath();
    line.forEach((p,i)=>{
      if(i===0) ctx.moveTo(p.x,p.y);
      else ctx.lineTo(p.x,p.y);
    });
    ctx.stroke();
  });

  ctx.beginPath();
  currentLine.forEach((p,i)=>{
    if(i===0) ctx.moveTo(p.x,p.y);
    else ctx.lineTo(p.x,p.y);
  });
  ctx.stroke();
}

// -------- UNDO --------
function undoLine(){
  drawings.pop();
  drawAll();
}

// -------- CLEAR --------
function clearAll(){
  drawings = [];
  drawAll();
}

// -------- SAVE --------
function savePlay(){
  localStorage.setItem("gaaPlay", JSON.stringify({players, drawings}));
  alert("Saved");
}

// -------- LOAD --------
function loadPlay(){
  let data = JSON.parse(localStorage.getItem("gaaPlay"));
  if(!data) return;
  players = data.players || [];
  drawings = data.drawings || [];
  drawAll();
}

// -------- EXPORT --------
function exportImage(){
  let link = document.createElement("a");
  link.download = "gaa-play.png";
  link.href = canvas.toDataURL();
  link.click();
}

// init
drawAll();
</script>

</body>
</html>
