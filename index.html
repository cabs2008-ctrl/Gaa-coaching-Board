<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAA Tactics Board</title>

<style>
body { margin:0; display:flex; font-family:sans-serif; }

/* SIDEBAR */
#sidebar {
  width:140px;
  background:#111;
  padding:10px;
  display:flex;
  flex-wrap:wrap;
}

.player {
  width:36px; height:36px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  margin:4px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.green { background:#4caf50; color:#000; }
.blue { background:#2196f3; color:#fff; }

/* PITCH */
#pitchWrap {
  flex:1;
  position:relative;
  background:#2e7d32;
}

/* LINES */
.line {
  position:absolute;
  top:0;
  bottom:0;
  width:2px;
  background:white;
  opacity:0.6;
}

/* GOAL BOX */
.goal {
  position:absolute;
  border:2px solid white;
}

/* CANVAS */
#canvas {
  position:absolute;
  top:0;
  left:0;
}

/* TOOLBAR */
#toolbar {
  position:absolute;
  top:10px;
  right:10px;
  z-index:10;
}
button {
  margin-left:5px;
  padding:6px 10px;
}
</style>

</head>

<body>

<div id="sidebar"></div>

<div id="pitchWrap">

<!-- TOOLBAR -->

<div id="toolbar">
  <button onclick="toggleDraw()">Draw</button>
  <button onclick="clearCanvas()">Clear</button>
</div>

<!-- GAA LINES -->

<div class="line" style="left:10%"></div>
<div class="line" style="left:18%"></div>
<div class="line" style="left:30%"></div>

<div class="line" style="left:70%"></div>
<div class="line" style="left:82%"></div>
<div class="line" style="left:90%"></div>

<!-- GOALS -->

<div class="goal" style="left:0; top:40%; width:80px; height:20%;"></div>
<div class="goal" style="right:0; top:40%; width:80px; height:20%;"></div>

<!-- GAA ARCS -->

<svg style="position:absolute; width:100%; height:100%; pointer-events:none;">

  <!-- LEFT ARC -->

<path d="M 120 20% Q 260 50% 120 80%" 
     stroke="white" fill="none" stroke-width="2"/>

  <!-- RIGHT ARC -->

<path d="M calc(100% - 120px) 20% 
        Q calc(100% - 260px) 50% 
        calc(100% - 120px) 80%" 
     stroke="white" fill="none" stroke-width="2"/>

</svg>

<!-- DRAW CANVAS -->

<canvas id="canvas"></canvas>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const pitch = document.getElementById("pitchWrap");

/* CANVAS SIZE FIX */
function resize(){
  canvas.width = pitch.clientWidth;
  canvas.height = pitch.clientHeight;
}
resize();
window.addEventListener("resize", resize);

/* DRAWING */
let drawMode = false;
let drawing = false;

function toggleDraw(){
  drawMode = !drawMode;
}

canvas.addEventListener("mousedown", e=>{
  if(!drawMode) return;
  drawing = true;
  const rect = canvas.getBoundingClientRect();
  ctx.beginPath();
  ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
});

canvas.addEventListener("mousemove", e=>{
  if(!drawing) return;
  const rect = canvas.getBoundingClientRect();
  ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;
  ctx.stroke();
});

canvas.addEventListener("mouseup", ()=> drawing=false);

/* CLEAR */
function clearCanvas(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

/* PLAYERS */
const sidebar = document.getElementById("sidebar");

function makePlayer(color, num){
  const p = document.createElement("div");
  p.className = "player " + color;
  p.innerText = num;

  let dragging = false;

  p.addEventListener("mousedown", e=>{
    e.stopPropagation();
    dragging = true;
    document.body.appendChild(p);
    move(e);
  });

  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", ()=> dragging=false);

  function move(e){
    if(!dragging) return;
    p.style.position = "absolute";
    p.style.left = (e.pageX - 18) + "px";
    p.style.top = (e.pageY - 18) + "px";
  }

  sidebar.appendChild(p);
}

/* CREATE TEAMS */
for(let i=1;i<=15;i++){
  makePlayer("green", i);
  makePlayer("blue", i);
}
</script>

</body>
</html>
